[package]
name = "lieutenant-fizz-player"
version = "0.1.0"
description = "Lieutenant Fizz: the Android and desktop player"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/liminal-hq/lieutenant-fizz"
edition = "2021"

# The app is its own workspace root: the repository's root workspace excludes it, and this empty table
# keeps Cargo from looking further up for another one.
[workspace]

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name (a Windows-only
# problem, see https://github.com/rust-lang/cargo/issues/8519).
name = "lieutenant_fizz_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Dev tooling. Cargo cannot gate a dependency on `debug_assertions`, so it is always compiled in but
# only registered under `#[cfg(debug_assertions)]` in `src/lib.rs`: present but inert in release.
# Pinned below 0.13, whose websocket code calls `WebviewWindow::minimize()` and `maximize()`, which
# do not exist on mobile, so it fails to compile for Android whatever the build profile.
tauri-plugin-mcp-bridge = "0.12"

# Saves, options and touch settings (every `lf-*` key) live in `lf-data.json` in the app data directory.
tauri-plugin-store = "2"

# Haptics: capability reporting and a stepped fallback ladder over the Android vibrator. The plugin is
# unreleased and still moving, so it is pinned to a commit of `feat/haptics-plugin` (PR #85 in
# liminal-hq/tauri-plugins-workspace). Its build script adds the VIBRATE permission to the Android manifest.
tauri-plugin-haptics = { git = "https://github.com/liminal-hq/tauri-plugins-workspace", rev = "82a166fbe878d6647b9dbe4a7e46f0967a8d861a" }

# The Android Back gesture. Copied from Cadence and authored here until it moves to tauri-plugins-workspace.
tauri-plugin-predictive-back = { path = "../../../plugins/predictive-back" }

# Logs: Rust and WebView output to stdout, a rotated file and the devtools console. Threshold's setup,
# including the local-time format (`chrono`).
tauri-plugin-log = "2"
log = "0.4"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
