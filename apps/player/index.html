<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" />
    <link rel="icon" href="data:," />
    <title>Lieutenant Fizz</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: #0a0a14;
        color: #e8e8f0;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 12px;
      }
      .rows {
        display: grid;
        gap: 10px;
        max-width: 28rem;
      }
      .rows button {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        min-height: 44px;
        padding: 12px 16px;
        border: 2px solid #ff55ff;
        background: transparent;
        color: #fff;
        font: inherit;
        text-align: left;
      }
      .rows button:focus-visible {
        outline: 4px solid #ffff55;
        outline-offset: 2px;
        background: #3a1a4a;
      }
      .rows small {
        color: #a8a8c0;
      }
      .snackbar {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        padding: 10px 16px;
        background: #e8e8f0;
        color: #0a0a14;
      }
      .snackbar[hidden] {
        display: none;
      }
    </style>
  </head>
  <body data-pad="menu">
    <main id="launcher"></main>
    <script type="module" src="./src/menu.ts"></script>
    <script type="module" src="./src/launcher/main.ts"></script>
  </body>
</html>
