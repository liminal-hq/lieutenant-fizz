    const T = {
      scrim: { base: { bg: 'transparent', border: '0', shadow: 'none', pad: '0', radius: '0', align: 'flex-start', gap: '10px' }, title: { left: '40px', right: '200px', top: '184px', tf: 'none' }, list: { left: '40px', right: '230px' }, card: { left: '40px', right: '150px' }, wide: { left: '40px', right: '40px' }, prompt: { left: '110px', right: '110px', top: 'auto', bottom: '40px', tf: 'none', bg: 'rgba(12,12,16,.88)', border: '1px solid rgba(255,255,255,.12)', pad: '14px 18px', radius: '12px', gap: '4px' } },
      window: { base: { bg: '#0000aa', border: '6px double #55ffff', shadow: '8px 8px 0 #000000', pad: '22px 10px 12px', radius: '0', align: 'stretch', gap: '8px' }, title: { left: '170px', right: '170px', top: '184px', tf: 'none' }, list: { left: '150px', right: '150px' }, card: { left: '96px', right: '96px', pad: '26px 22px 16px' }, wide: { left: '34px', right: '34px' }, prompt: { left: '110px', right: '110px', top: 'auto', bottom: '40px', tf: 'none', pad: '22px 16px 12px', gap: '4px' } },
      band: { base: { bg: '#000000', border: '0', shadow: 'inset 0 4px 0 #ffaa40, inset 0 -4px 0 #f43f5e', pad: '20px 40px', radius: '0', align: 'center', gap: '10px', left: '0px', right: '0px' }, title: { pad: '10px 40px' }, list: { pad: '8px 200px' }, card: { pad: '16px 90px' }, wide: { pad: '8px 40px' }, prompt: { top: 'auto', bottom: '30px', tf: 'none', pad: '16px 40px', gap: '4px' } },
      text: { base: { bg: 'transparent', border: '0', shadow: 'none', pad: '0', radius: '0', align: 'stretch', gap: '8px' }, title: { left: '44px', right: '210px', top: '184px', tf: 'none' }, list: { left: '44px', right: '230px' }, card: { left: '44px', right: '150px' }, wide: { left: '44px', right: '44px' }, prompt: { left: '110px', right: '110px', top: 'auto', bottom: '40px', tf: 'none', bg: '#000000', border: '4px double #55ffff', pad: '14px 16px', gap: '4px' } },
    }[vk];
    const c = Object.assign({ left: '0px', right: '0px' }, T.base, T[group]);
    if (c.left === 'auto') c.left = '0px';
    if (c.right === 'auto') c.right = '0px';
    return c;
  }

  items(screen, o) {
    const L = ['Keen-style', 'Modern'], X = ['Normal', 'Large'], Mo = ['System', 'Reduced', 'Full'];
    switch (screen) {
      case 'title': return [{ label: 'New Game' }, { label: 'Continue', value: 'Slot 2' }, { label: 'Load game' }, { label: 'Options' }, { label: 'Controls' }];
      case 'pause': return [{ label: 'Resume' }, { label: 'Save game', value: 'F5' }, { label: 'Load game', value: 'F9' }, { label: 'Options' }, { label: 'Leave level' }, { label: 'Quit to title' }];
      case 'options': return [{ label: 'Music', meter: o.music, key: 'music' }, { label: 'Sound', meter: o.sfx, key: 'sfx' }, { label: 'Captions', value: o.captions ? 'On' : 'Off', key: 'captions' }, { label: 'Controls', value: L[o.layout], key: 'layout' }, { label: 'Text size', value: X[o.text], key: 'text' }, { label: 'Motion', value: Mo[o.motion], key: 'motion' }, { label: 'Back' }];
      case 'gameover': return [{ label: 'Load last save' }, { label: 'Title screen' }];
      case 'cleared': return [{ label: 'Back to the map' }];
      case 'controls': return [{ label: 'Back' }];
      default: return [];
    }
  }

  slotsData() {
    return [
      { name: 'Autosave', place: 'Crystal Caves', cleared: 1, lives: 3, score: '1,240', time: '0:42', date: 'Wed, 7 Oct', thumb: 1 },
      { name: 'Slot 1', place: 'Crater Fields', cleared: 0, lives: 3, score: '310', time: '0:09', date: 'Sun, 4 Oct', thumb: 0 },
      { name: 'Slot 2', place: 'Crystal Caves', cleared: 1, lives: 2, score: '1,180', time: '0:39', date: 'Tue, 6 Oct', thumb: 1 },
      { name: 'Slot 3', place: 'Mildred’s Citadel', cleared: 2, lives: 4, score: '2,960', time: '1:12', date: 'Tue, 6 Oct', thumb: 2 },
      { name: 'Slot 4', empty: true },
    ];
  }

  count() {
    const s = this.props.screen;
    if (s === 'saves') return 5;
    return this.items(s, this.state.o).length;
  }
  select(i) {
    if (i === this.state.sel) return;
    this.setState({ sel: i, look: performance.now() / 1000 + 1.6, now: performance.now() / 1000 });
  }
  adjust(d) {
    if (this.props.screen !== 'options') return;
    const it = this.items('options', this.state.o)[this.state.sel];
    if (!it || !it.key) return;
    const o = Object.assign({}, this.state.o), k = it.key;
    const mod = (v, n) => ((v % n) + n) % n;
    if (k === 'music' || k === 'sfx') o[k] = Math.max(0, Math.min(8, o[k] + d));
    else if (k === 'captions') o.captions = !o.captions;
    else if (k === 'layout') o.layout = mod(o.layout + d, 2);
    else if (k === 'text') o.text = mod(o.text + d, 2);
    else if (k === 'motion') o.motion = mod(o.motion + d, 3);
    this.setState({ o });
  }
  activate(i) {
    const now = performance.now() / 1000;
    if (i !== undefined && i !== this.state.sel) this.setState({ sel: i });
    const sel = i ?? this.state.sel;
    if (this.props.screen === 'options') {
      const it = this.items('options', this.state.o)[sel];
      if (it && it.key) {
        const o = Object.assign({}, this.state.o);
        if (it.key === 'music' || it.key === 'sfx') o[it.key] = (o[it.key] + 1) % 9;
        else { this.state.sel = sel; this.adjust(1); }
        if (it.key === 'music' || it.key === 'sfx') this.setState({ o });
      }
    }
    this.setState({ flash: now + 0.16, wave: this.props.screen === 'title' ? now + 0.9 : 0, now });
  }

  wrap(text, max) {
    const out = []; let line = '';
    for (const w of text.split(' ')) { if ((line + ' ' + w).trim().length > max) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
    if (line) out.push(line);
    return out;
  }
  ink(bg) {
    const h = bg.replace('#', ''); if (h.length !== 6) return '#000000';
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35 ? '#000000' : '#ffffff';
  }

  benState(now, reduced) {
    const art = this.state.art, W = this.state.logoW, Hh = this.state.logoH;
    const home = W + 4;
    const mk = (pose, x, y, flip, rot) => ({ src: art['ben_' + pose] || '', left: Math.round(x) + 'px', bottom: Math.round(y) + 'px', tf: `scaleX(${flip ? -1 : 1}) rotate(${rot}deg)` });
    if (reduced) return mk('stand', home, 0, false, 0);
    if (this.state.wave > now) { const k = 1 - (this.state.wave - now) / 0.9; return mk('shoot', home, Math.sin(k * Math.PI) * 18, true, 0); }
    const p = (now - this.t0) % 14;
    const looking = this.state.look > now;
    const bob = Math.floor(p * 1.5) % 2 ? 3 : 0;
    if (p >= 4.5 && p < 6.5) return mk('stand', home - 8, 0, looking, -12);
    if (p >= 9 && p < 13) {
      const topY = Hh - 14, startX = home - 40, endX = -6;
      if (p < 9.4) { const k = (p - 9) / 0.4; return mk('jump', home + (startX - home) * k, topY * k + Math.sin(k * Math.PI) * 26, true, 0); }
      if (p < 12.6) {
        const q = p < 11 ? (p - 9.4) / 1.6 : 1 - (p - 11) / 1.6;
        const x = startX + (endX - startX) * q;
        const hop = Math.abs(Math.sin((p - 9.4) * Math.PI * 2.5));
        return mk(hop < 0.25 ? 'pogo2' : 'pogo', x, topY + hop * 22, p < 11, 0);
      }
      const k = (p - 12.6) / 0.4; return mk('jump', startX + (home - startX) * k, topY * (1 - k) + Math.sin(k * Math.PI) * 20, false, 0);
    }
    return mk('stand', home, bob, looking, 0);
  }

  renderVals() {
    const P = this.props, s = this.state;
    const C = this.cfg();
    const vk = C[P.variant] ? P.variant : 'scrim';
    const v = C[vk];
    const screen = ['title', 'pause', 'options', 'controls', 'gameover', 'cleared', 'prompt', 'saves'].includes(P.screen) ? P.screen : 'title';
    const reduced = this.reduced();
    const now = s.now || this.t0 || 0;
    const tt = now - (this.t0 || now);
    const mode = P.hints && P.hints !== 'auto' ? P.hints : s.mode;
    const pad = mode === 'gamepad';
    const group = screen === 'title' ? 'title' : screen === 'pause' || screen === 'options' ? 'list' : screen === 'gameover' || screen === 'cleared' ? 'card' : screen === 'prompt' ? 'prompt' : 'wide';
    const c = this.container(vk, group);
    const hud = screen === 'pause' || screen === 'prompt';
    const barH = { scrim: 32, window: 28, band: 34, text: 46 }[vk];
    const z = group === 'title' ? { top: '148px', bottom: barH + 8 + 'px', justify: 'flex-start' } : group === 'prompt' ? { top: '60px', bottom: '28px', justify: 'flex-end' } : { top: hud ? (vk === 'text' ? '66px' : '54px') : (vk === 'text' ? '36px' : '16px'), bottom: barH + 8 + 'px', justify: 'center' };
    const cyc = reduced ? v.cycle[0] : v.cycle[Math.floor(tt * 2.5) % v.cycle.length];
    const selBg = s.flash > now ? '#ffffff' : cyc;
    const selInk = this.ink(selBg);
    const items = this.items(screen, s.o);
    const sel = Math.min(s.sel, Math.max(0, (screen === 'saves' ? 5 : items.length) - 1));
    const blinkOn = reduced || Math.floor(tt * 1.6) % 2 === 0;
    let cursorTf = 'translateY(-50%)';
    if (!reduced && v.cursorKind === 'bob') cursorTf = `translate(${Math.round(Math.sin(tt * 5) * 2) * 2}px,-50%)`;
    if (!reduced && v.cursorKind === 'hover') cursorTf = `translateY(calc(-50% + ${Math.round(Math.sin(tt * 3) * 2) * 2}px))`;
    const rows = items.map((it, i) => {
      const on = i === sel;
      const meter = it.meter !== undefined ? Array.from({ length: 8 }, (_, k) => ({ c: k < it.meter ? (on && v.clip !== 'none' ? selInk : v.meterOn) : (on && v.clip !== 'none' ? 'rgba(0,0,0,.25)' : v.meterOff) })) : [];
      const adjustable = screen === 'options' && it.value !== undefined && on;
      return {
        label: it.label, bg: on ? selBg : 'transparent', bgSolid: on ? selBg : v.knock, clip: on ? v.clip : 'none',
        color: on ? selInk : v.text, hasValue: it.value !== undefined, value: adjustable ? `◄ ${it.value} ►` : it.value || '',
        vcolor: on ? selInk : v.dim, hasMeter: it.meter !== undefined, meter, showCursor: on && blinkOn && !!(s.art || {})[v.cursor],
        onEnter: () => this.select(i), onClick: () => this.activate(i),
      };
    });
    const headings = { pause: 'Paused', options: 'Options', controls: 'Controls', gameover: 'Out of lives', cleared: 'Crater Fields cleared', saves: 'Load game', title: vk === 'window' ? 'Main menu' : '' };
    const heading = headings[screen] || '';
    const bodies = { gameover: 'You finished with 240 snack points. Your last save is still on this device.', cleared: 'The first teleporter on the map is humming now. The Crystal Caves are waiting.' };
    let lines = [];
    if (bodies[screen]) {
      const full = bodies[screen];
      const shown = reduced ? full.length : Math.min(full.length, Math.floor(Math.max(0, tt - 0.4) * 40));
      let left = shown;
      lines = this.wrap(full, vk === 'window' ? 36 : 38).map((ln) => { const t = ln.slice(0, Math.max(0, left)); left -= ln.length + 1; return { text: t || ' ' }; });
    }
    const L = ['Keen-style', 'Modern'];
    const activeCol = pad ? 3 : s.o.layout + 1;
    const table = [['Action', 'Keen-style', 'Modern', 'Gamepad'], ['Move', '{[←→]}', '{[←→]} {[A]} {[D]}', 'D-pad'], ['Jump', '{Ctrl}', '{[Z]}', '{A}'], ['Pogo', '{Alt}', '{[X]}', '{B} {Y}'], ['Fizz', '{Space}', '{[C]}', '{X} {RT}'], ['Menu', '{Esc}', '{Esc} {[P]}', '{Start}'], ['Save, load', '{F5} {F9}', '{F5} {F9}', 'Pause menu']];
    const ctrlCells = [];
    table.forEach((row, ri) => row.forEach((cell, ci) => ctrlCells.push({ text: cell, color: ri === 0 ? (ci === activeCol ? v.accent : v.dim) : ci === 0 ? v.text : ci === activeCol ? v.accent : v.muted })));
    const art = s.art || {};
    const slots = this.slotsData().map((d, i) => {
      const on = i === sel;
      const bg = on ? selBg : 'transparent';
      const k1 = on ? selInk : v.text, k2 = on ? selInk : v.dim;
      return {
        bg, clip: on ? v.clip : 'none', hasThumb: !d.empty && !!art.thumbs, noThumb: d.empty || !art.thumbs, thumb: art.thumbs ? art.thumbs[d.thumb || 0] : '', frame: on ? selInk : v.dim,
        line1: d.empty ? `${d.name} · Empty` : `${d.name} · ${d.place}${i === 0 ? ' · read-only' : ''}`,
        line2: d.empty ? 'Save from the pause menu to use this slot' : `Lives ${d.lives} · ${d.score} pts · ${d.time} played · ${d.date}`,
        c1: k1, c2: k2,
        pips: d.empty ? [] : [0, 1, 2].map((k) => ({ c: k < d.cleared ? (on ? selInk : v.accent) : on ? 'rgba(0,0,0,.25)' : v.meterOff })),
        onEnter: () => this.select(i), onClick: () => this.activate(i),
      };
    });
    const kb = { choose: '{[↑↓]} Choose', change: '{[←→]} Change', select: '{Enter} Select', back: '{Esc} Back', resume: '{Esc} Resume' };
    const gp = { choose: '{[↑↓]} Choose', change: '{[←→]} Change', select: '{A} Select', back: '{B} Back', resume: '{Start} Resume' };
    const H = pad ? gp : kb;
    const hintSets = { title: [H.choose, H.select], pause: [H.choose, H.select, H.resume], options: [H.choose, H.change, H.back], controls: [H.select, H.back], gameover: [H.choose, H.select], cleared: [H.select], saves: [H.choose, H.select, H.back] };
    const hints = (hintSets[screen] || []).join('  ');
    const overlays = {
      scrim: group === 'wide' ? 'rgba(5,5,7,.86)' : 'linear-gradient(90deg,rgba(5,5,7,.94) 0%,rgba(5,5,7,.76) 50%,rgba(5,5,7,.1) 85%)',
      window: 'rgba(0,0,0,.42)', band: 'rgba(5,5,7,.5)', text: 'transparent',
    };
    const ben = this.benState(now, reduced);
    return {
      label: `${({ scrim: '2a', window: '2b', band: '2c', text: '2d' })[vk]} ${screen}`,
      rootRef: this.rootRef, logoRef: this.logoRef,
      onEnterFrame: () => { const el = this.rootRef.current; if (el && document.activeElement !== el) el.focus({ preventScroll: true }); },
      onKey: (e) => {
        const k = e.key;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(k)) e.preventDefault();
        if (s.mode !== 'keyboard' && !this.padConnected()) this.setState({ mode: 'keyboard' });
        const n = this.count();
        if (k === 'ArrowUp' || k === 'w') this.select((sel - 1 + n) % n);
        else if (k === 'ArrowDown' || k === 's') this.select((sel + 1) % n);
        else if (k === 'ArrowLeft') this.adjust(-1);
        else if (k === 'ArrowRight') this.adjust(1);
        else if (k === 'Enter' || k === ' ' || k === 'z') this.activate();
      },
      v, c, z, art,
      showNight: v.scene && screen !== 'prompt' && !!art.night,
      showWorld: screen === 'prompt' && !!art.world,
      chromeOverlay: screen !== 'prompt' && (vk !== 'text') && (group !== 'title' || vk === 'scrim'),
      overlayBg: overlays[vk],
      chromeText: vk === 'text' && screen !== 'prompt',
      textTab: `lfizz.exe · ${heading || 'Main menu'}`,
      showHud: screen === 'pause' || screen === 'prompt',
      hudLeft: vk === 'text' && screen !== 'prompt' ? '28px' : '12px', hudTop: vk === 'text' && screen !== 'prompt' ? '28px' : '12px',
      isTitle: screen === 'title', logo: v.logo, ben, hasBen: !!ben.src,
      headTab: v.tab && !!heading && screen !== 'prompt',
      headInline: !v.tab && !!heading && vk !== 'text' && screen !== 'prompt',
      heading, headColor: v.head.color, headShadow: v.head.shadow, headScale: v.head.scale,
      hasLines: lines.length > 0, lines,
      hasRows: rows.length > 0, rows,
      cursorSrc: art[v.cursor] || '', cursorTf,
      isControls: screen === 'controls', ctrlCells,
      isSaves: screen === 'saves', slots,
      isPrompt: screen === 'prompt',
      promptAction: pad ? '{A} Enter level' : '{Enter} Enter level',
      hasNote: screen === 'pause',
      note: screen === 'pause' ? 'Saves stay on this device.' : `Showing ${pad ? 'gamepad' : L[s.o.layout]} · change layout in Options`,
      hasBar: screen !== 'prompt', bar: v.bar, hints,
      showMode: true, modeLabel: pad ? '🎮 Gamepad' : 'Keyboard',
    };
  }
}
</script>
