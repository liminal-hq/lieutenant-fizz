[package]
name = "tauri-plugin-predictive-back"
version = "0.1.0"
authors = ["Liminal HQ, Scott Morris"]
edition = "2021"
links = "tauri-plugin-predictive-back"
description = "Android predictive back gesture support for Tauri apps"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
thiserror = "2.0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
