[workspace]
members = ["crates/sim", "episodes/episode-1/game"]
# The Tauri app is its own workspace (own lockfile and profile) so its heavy dependencies and system
# libraries stay out of the simulation's checks; see `apps/player/src-tauri/Cargo.toml`.
exclude = ["apps/player/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/liminal-hq/lieutenant-fizz"
repository = "https://github.com/liminal-hq/lieutenant-fizz"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The playtest bot searches thousands of simulated ticks per level, which takes minutes unoptimised.
[profile.test]
opt-level = 2
