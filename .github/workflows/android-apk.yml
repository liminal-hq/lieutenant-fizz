# Builds an installable debug APK of the Tauri player for on-device testing.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

# GitHub Actions is the default place to build Android (the one sanctioned local path is
# scripts/build-android-dev.sh). The tracked `apps/player/src-tauri/gen/android` is the real app, so this
# builds the side-by-side dev app like the local script does: it regenerates the project for the `.dev`
# identifier, re-applies the Android settings and stamps the dev icon (scripts/prepare-android-dev.sh).
# Run it against any branch: gh workflow run android-apk.yml --ref <branch>
# It also runs on pushes to feat/tauri-player* branches, so it can run before it exists on main.

name: Android Debug APK

on:
  workflow_dispatch:
    inputs:
      publish_draft_release:
        description: Also attach the APK to a draft pre-release for a direct phone download
        type: boolean
        default: false
  push:
    branches:
      - 'feat/tauri-player*'

permissions:
  contents: read
  packages: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/liminal-hq/tauri-ci-mobile:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # Gradle reads debug.keystore from here, independent of the container's HOME.
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - uses: actions/checkout@v7

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/player/src-tauri

      # `rust-toolchain.toml` pins the toolchain and lists only the WASM target.
      - name: Add the Android target
        run: rustup target add aarch64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the WASM and the app frontend
        run: |
          bun run build:wasm
          bun run build:app

      - name: Regenerate the project as the dev app
        run: bash scripts/prepare-android-dev.sh

      # The signing key exists only between this step and the removal after the build, so
      # dependency installs, the Rust cache and the artifact upload never see it.
      - name: Restore stable debug keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$ANDROID_USER_HOME"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: bun run android:build --debug --target aarch64 --apk --config src-tauri/tauri.conf.dev.json

      - name: Remove the debug keystore
        if: always()
        run: rm -f "$ANDROID_USER_HOME/debug.keystore"

      - name: Locate APK
        id: apk
        run: |
          apk="$(find apps/player/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: fizz-player-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Summarise
        run: |
          cert="$(apksigner verify --print-certs '${{ steps.apk.outputs.path }}' | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          {
            echo "## Android debug APK"
            echo "- **Ref:** \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`"
            echo "- **File:** \`$(basename '${{ steps.apk.outputs.path }}')\`"
            echo "- **Signing certificate (SHA-256):** \`${cert}\`"
            if [ "${{ steps.keystore.outputs.stable }}" != "true" ]; then
              echo "- **Signing:** throwaway debug key — uninstall the previous build before installing this one, or set the \`ANDROID_DEBUG_KEYSTORE_BASE64\` secret for in-place updates"
            else
              echo "- **Signing:** stable debug key — installs over the previous build"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-draft-release:
    name: Attach APK to draft pre-release
    if: inputs.publish_draft_release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: fizz-player-debug-apk
          path: apk

      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # GITHUB_RUN_NUMBER is unchanged by a re-run, so the attempt is part of the tag. A tag that
          # already exists (the step re-running in the same attempt) gets its APK replaced instead.
          TAG="android-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" apk/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft --prerelease \
              --title "Android debug build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} (${REF_NAME})" \
              --notes "Debug APK built from \`${REF_NAME}\` at \`${GITHUB_SHA}\`. Signed with a debug key; for on-device testing only."
          fi
